
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o GoluLauncher_final.zip
      - name: Fix Kotlin import
        run: sed -i '/import androidx.compose.ui.input.key.nativeKeyEvent/d' GoluLauncher/app/src/main/java/com/golu/launcher/Home.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p GoluLauncher assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GoluLauncher-APK
          path: GoluLauncher/app/build/outputs/apk/debug/*.apk
